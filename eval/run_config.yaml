# Fixed configuration for every evaluated run (eval/PROTOCOL.md, protocol v2).
# Read by evalrun.runner and recorded in each run's results.json. "today" is
# pinned so prompts and the response cache never depend on the real date.
provider: gemini
model: gemini-3.5-flash-lite
temperature: 0.0
today: 2026-10-04
max_steps: 3
max_attempts_per_step: 3
cache_dir: eval/.llm_cache
