# --- recovery: the obvious first query is empty or silently wrong ----------
- id: ha13
  type: recovery
  question: How much did we spend on marketing in Q3 2025?
  notes: >-
    marketing_spend.month is 'YYYY-MM'. Filtering it with day-level dates
    ('2025-07-01'..'2025-09-30') silently drops July (386,920 instead of
    532,066); a date-range sanity check catches it.
  gold:
    sql: |
      SELECT SUM(amount) AS spend
      FROM marketing_spend
      WHERE month BETWEEN '2025-07' AND '2025-09'
  answer_checks:
    - gold_number: [0, 0]

- id: ha14
  type: recovery
  question: How many customers have never placed an order?
  notes: >-
    An inner join to orders returns zero rows for these customers; the
    answer needs an anti-join (NOT EXISTS / LEFT JOIN ... IS NULL).
  gold:
    sql: |
      SELECT COUNT(*) AS customers
      FROM customers c
      WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)
  answer_checks:
    - gold_number: [0, 0]
      rel: 0
      abs: 0

