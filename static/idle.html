<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentCrew: session ended</title>
<style>
  /* Same palette and type as .streamlit/config.toml, so the page reads as
     part of the app. No external requests: this page exists so the browser
     stops talking to the server. */
  html { background: #FFFFFF; color: #1E293B; font: 15px/1.6 "IBM Plex Sans", system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  main { max-width: 36rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
  p { margin: 0 0 1rem; color: #64748B; }
  a { color: #2563EB; text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>This session ended</h1>
  <p>There was no activity for a while, so the connection to AgentCrew was closed.
     Nothing from the session was kept.</p>
  <p><a href="/">Start again</a></p>
</main>
</body>
</html>
