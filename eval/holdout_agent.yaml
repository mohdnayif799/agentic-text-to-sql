# Holdout: questions that need an agent (eval protocol v2). 21 questions,
# 3 per type. Written and validated against the data only (no architecture
# was run on them). Frozen by eval/FREEZE_v2.sha256 once approved; never used
# for tuning. Gold results: eval/gold/holdout_agent.json (scripts/build_gold.py).
#
# Canonical definitions (also stated in the shared data dictionary):
#   revenue        = SUM(quantity * unit_price * (1 - discount)) over completed orders
#   order value    = revenue of one completed order (sum of its line items)
#   units sold     = SUM(quantity) over completed orders
#   gross margin % = SUM(quantity * (unit_price * (1 - discount) - unit_cost)) / revenue
#   churned in P   = customers.churn_date falls in period P
#   refund rate    = refunded orders / all orders (any status), as a percentage
#   marketing_spend.month is TEXT 'YYYY-MM'; all other dates are 'YYYY-MM-DD'

# --- multi-hop: the second step depends on the first result ----------------
- id: ha01
  type: multi_hop
  question: >-
    Which customer segment had the most customers churn in 2025, and who was
    that segment's top customer by completed revenue in 2025? Give the
    customer's ID, name and 2025 completed revenue.
  notes: >-
    Hop 1: Mid-Market (61 churned vs SMB 48, Enterprise 27). Hop 2: customer
    84 Jonas Duarte (34,461) ahead of 791 Ines Sharma (33,953). Names are not
    unique, hence the ID.
  top_n: 1
  gold:
    sql: |
      WITH seg AS (
        SELECT segment FROM customers
        WHERE churn_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY segment ORDER BY COUNT(*) DESC LIMIT 1
      )
      SELECT c.customer_id, c.customer_name, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue_2025
      FROM customers c
      JOIN orders o ON o.customer_id = c.customer_id
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.status = 'completed'
        AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        AND c.segment = (SELECT segment FROM seg)
      GROUP BY c.customer_id, c.customer_name
      ORDER BY revenue_2025 DESC
      LIMIT 1
  answer_checks:
    - text: Mid-Market
    - text: Jonas Duarte
    - gold_number: [0, 2]

- id: ha02
  type: multi_hop
  question: >-
    In the 2025 month with the lowest total marketing spend, what was our
    completed revenue?
  notes: >-
    Hop 1: 2025-07 (145,145 vs next lowest 158,938). Hop 2: completed revenue
    in July 2025.
  gold:
    sql: |
      WITH low AS (
        SELECT month FROM marketing_spend
        WHERE month BETWEEN '2025-01' AND '2025-12'
        GROUP BY month ORDER BY SUM(amount) LIMIT 1
      )
      SELECT SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.status = 'completed'
        AND substr(o.order_date, 1, 7) = (SELECT month FROM low)
  answer_checks:
    - gold_number: [0, 0]
    - any_of:
        - text: "2025-07"
        - pattern: "jul(y)?\\.?\\s+2025"

- id: ha03
  type: multi_hop
  question: >-
    Which product category had the lowest gross margin percentage in 2025,
    and which product in that category sold the most units in 2025? Give the
    product's ID, name and units sold in 2025.
  notes: >-
    Hop 1: Accessories (31.2% vs Services 35.0%). Hop 2: Anchor Prism (1,075
    units vs Delta Pivot 999). Anchor Prism is not the top unit seller
    overall, so skipping hop 1 gives a different answer. Gold is by
    product_id (names are unique in this category).
  top_n: 1
  gold:
    sql: |
      WITH margin AS (
        SELECT p.category,
               SUM(oi.quantity * (oi.unit_price * (1 - oi.discount) - p.unit_cost))
                 / SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS gm
        FROM orders o
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed'
          AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY p.category
      )
      SELECT p.product_id, p.product_name, SUM(oi.quantity) AS units
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN products p ON p.product_id = oi.product_id
      WHERE o.status = 'completed'
        AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        AND p.category = (SELECT category FROM margin ORDER BY gm LIMIT 1)
      GROUP BY p.product_id, p.product_name
      ORDER BY units DESC
      LIMIT 1
  answer_checks:
    - text: Accessories
    - text: Anchor Prism
    - gold_number: [0, 2]
      rel: 0
      abs: 0

# --- term matching: user words must be mapped to real values ---------------
- id: ha04
  type: term_matching
  question: How many sev-1 support tickets did our European customers open in 2025?
  notes: >-
    "sev-1" -> severity 'critical' (the most severe of low/medium/high/
    critical); "European" -> regions.region_name = 'EMEA'.
  gold:
    sql: |
      SELECT COUNT(*) AS tickets
      FROM support_tickets t
      JOIN customers c ON c.customer_id = t.customer_id
      JOIN regions r ON r.region_id = c.region_id
      WHERE r.region_name = 'EMEA' AND t.severity = 'critical'
        AND t.created_date BETWEEN '2025-01-01' AND '2025-12-31'
  answer_checks:
    - gold_number: [0, 0]
      rel: 0
      abs: 0

