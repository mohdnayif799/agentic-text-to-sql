# --- ambiguous: accepted interpretations written in advance ----------------
# Pass = the result matches one accepted interpretation's gold AND the answer
# names that interpretation's metric AND states an assumption.
- id: ha16
  type: ambiguous
  question: >-
    What was our best month in 2025? Give the month (as YYYY-MM) and the
    figure that makes it the best.
  notes: >-
    "Best" is undefined; the three readings give three different months. The
    figure is graded with the month.
  top_n: 1
  interpretations:
    - name: completed_revenue
      gold:
        sql: |
          SELECT substr(o.order_date, 1, 7) AS month, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
          GROUP BY month
          ORDER BY revenue DESC LIMIT 1
      answer_checks:
        - pattern: "revenue|sales"
    - name: completed_order_count
      gold:
        sql: |
          SELECT substr(order_date, 1, 7) AS month, COUNT(*) AS completed_orders
          FROM orders
          WHERE status = 'completed' AND order_date BETWEEN '2025-01-01' AND '2025-12-31'
          GROUP BY month ORDER BY completed_orders DESC LIMIT 1
      answer_checks:
        - pattern: "orders"
    - name: all_order_count
      gold:
        sql: |
          SELECT substr(order_date, 1, 7) AS month, COUNT(*) AS orders
          FROM orders
          WHERE order_date BETWEEN '2025-01-01' AND '2025-12-31'
          GROUP BY month ORDER BY orders DESC LIMIT 1
      answer_checks:
        - pattern: "orders"

- id: ha17
  type: ambiguous
  question: >-
    Which customer segment is our most valuable? Give the segment and the
    figure that makes it the most valuable.
  notes: >-
    "Most valuable" could mean total revenue, revenue per customer (all
    customers in the segment, or only those who bought) or average order
    value, over all time or 2025. Answers differ (SMB vs Mid-Market); the
    figure is graded with the segment.
  top_n: 1
  interpretations:
    - name: total_revenue_all_time
      gold:
        sql: |
          SELECT c.segment, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE o.status = 'completed'
          GROUP BY c.segment
          ORDER BY revenue DESC LIMIT 1
      answer_checks:
        - pattern: "revenue|sales"
    - name: total_revenue_2025
      gold:
        sql: |
          SELECT c.segment, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
          GROUP BY c.segment
          ORDER BY revenue DESC LIMIT 1
      answer_checks:
        - pattern: "revenue|sales"
    - name: revenue_per_customer_all_time
      gold:
        sql: |
          SELECT c.segment, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / (SELECT COUNT(*) FROM customers c2 WHERE c2.segment = c.segment) AS revenue_per_customer
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE o.status = 'completed'
          GROUP BY c.segment
          ORDER BY revenue_per_customer DESC LIMIT 1
      answer_checks:
        - pattern: "per (customer|account|client|buyer|buying customer)"
    - name: revenue_per_customer_2025
      gold:
        sql: |
          SELECT c.segment, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / (SELECT COUNT(*) FROM customers c2 WHERE c2.segment = c.segment) AS revenue_per_customer
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
          GROUP BY c.segment
          ORDER BY revenue_per_customer DESC LIMIT 1
      answer_checks:
        - pattern: "per (customer|account|client|buyer|buying customer)"
    - name: revenue_per_buying_customer_all_time
      gold:
        sql: |
          SELECT c.segment, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / COUNT(DISTINCT c.customer_id) AS revenue_per_buyer
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE o.status = 'completed'
          GROUP BY c.segment
          ORDER BY revenue_per_buyer DESC LIMIT 1
      answer_checks:
        - pattern: "per (customer|account|client|buyer|buying customer)"
    - name: revenue_per_buying_customer_2025
      gold:
        sql: |
          SELECT c.segment, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / COUNT(DISTINCT c.customer_id) AS revenue_per_buyer
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
          GROUP BY c.segment
          ORDER BY revenue_per_buyer DESC LIMIT 1
      answer_checks:
        - pattern: "per (customer|account|client|buyer|buying customer)"
    - name: average_order_value_all_time
      gold:
        sql: |
          SELECT c.segment, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / COUNT(DISTINCT o.order_id) AS avg_order_value
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE o.status = 'completed'
          GROUP BY c.segment
          ORDER BY avg_order_value DESC LIMIT 1
      answer_checks:
        - pattern: 'order value|\baov\b|per order'
    - name: average_order_value_2025
      gold:
        sql: |
          SELECT c.segment, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / COUNT(DISTINCT o.order_id) AS avg_order_value
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
          GROUP BY c.segment
          ORDER BY avg_order_value DESC LIMIT 1
