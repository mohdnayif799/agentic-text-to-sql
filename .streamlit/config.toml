# Streamlit reads this from .streamlit/ in the working directory, both locally
# ("streamlit run app.py" from the repo root) and in the Docker image (/app).
# app.py's CHART_COLOR must equal primaryColor and CHART_FONT the sans font's
# family; tests/test_chat_ui.py checks both.

[server]
# Serves the static/ folder next to app.py at /app/static/, which is where the
# fonts below load from. The Dockerfile copies static/ into the image; without
# it the app still runs, silently in the browser's default font.
enableStaticServing = true

[theme]
base = "light"
# One accent; everything else is a slate neutral (Tailwind's slate scale).
# Green and red stay reserved for real success and error states.
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
# Sidebar, inputs and code blocks. Slate-50 rather than a blue tint, so small
# muted text (#64748B in app.py) keeps 4.5:1 contrast there too (4.6:1).
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"
# Inline `code` text. Streamlit's default is its green text colour, which
# would put green in the middle of an answer or a warning for no reason.
codeTextColor = "#1E293B"
borderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"
baseRadius = "0.5rem"

# IBM Plex, self-hosted from static/fonts/ (Latin subset, @fontsource 5.3.0,
# SIL Open Font License: see the OFL-*.txt files there). Both families have no
# tnum feature, but every digit is the same width by default, so figures are
# tabular everywhere, including the dataframe grid, which draws on a canvas
# that CSS cannot reach (scripts/dev/check_fonts.py verifies this).
font = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"
# 15 px root: every rem below is relative to it (1.625rem = 24.4 px).
baseFontSize = 15
headingFontSizes = ["1.625rem", "1.25rem", "1.0625rem"]
headingFontWeights = [600, 600, 600]
codeFontSize = "0.8125rem"
metricValueFontSize = "1.25rem"
metricValueFontWeight = 600

# One table per file. unicodeRange is the subset each file covers, so a
# character outside it falls back to the next font in the list above.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-500-normal.woff2"
weight = 500
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-600-normal.woff2"
weight = 600
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-500-normal.woff2"
weight = 500
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[client]
toolbarMode = "minimal"
# Unhandled exceptions show a generic message in the browser, never their text
# or traceback: a backstop in case a future error path forgets redact().
showErrorDetails = "none"
