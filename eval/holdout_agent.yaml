# --- why / drill-down: graded by driver check + rubric judge ----------------
- id: ha07
  type: why
  question: >-
    Why did APAC's completed revenue fall so much more than other regions'
    from Q2 to Q3 2025?
  notes: >-
    Verified: completed orders fell 28.6% in APAC vs 2.1-12.1% elsewhere,
    while average order value fell by a similar 32-39% in every region (the
    Hardware mix shift hit all regions). APAC's extra drop is order volume.
  driver_checks:
    - any_of:
        - pattern: "fewer\\s+(completed\\s+)?orders"
        - pattern: "order\\s+(volume|count|counts|numbers)"
        - pattern: "(number|count|volume)\\s+of\\s+(completed\\s+)?orders"
        - pattern: "orders\\s+(fell|dropped|declined|decreased|shrank)"
  judge_rubric: |
    Required facts (each must be stated or clearly implied; rounded figures
    are fine):
      1. APAC's number of completed orders fell by about 29% from Q2 to Q3
         2025 (about 280 to 200).
      2. Completed orders in the other regions fell far less (about 2% to
         12%).
      3. Average order value fell by a similar amount in every region (about
         32% to 39%), so order size does not explain why APAC fell more.
    Churn, fewer active customers or lower marketing spend may be added as
    context. FAIL if a required fact is missing or contradicted, if APAC's
    extra decline is attributed mainly to order size, the Hardware mix,
    prices or discounts, or if any stated figure contradicts the evidence.
    Judge facts only; ignore style and length.
  evidence:
    orders_and_aov_by_region: |
      WITH t AS (
        SELECT r.region_name,
               COUNT(DISTINCT CASE WHEN o.order_date <= '2025-06-30' THEN o.order_id END) AS q2_orders,
               COUNT(DISTINCT CASE WHEN o.order_date >= '2025-07-01' THEN o.order_id END) AS q3_orders,
               SUM(CASE WHEN o.order_date <= '2025-06-30' THEN oi.quantity * oi.unit_price * (1 - oi.discount) ELSE 0 END) AS q2_revenue,
               SUM(CASE WHEN o.order_date >= '2025-07-01' THEN oi.quantity * oi.unit_price * (1 - oi.discount) ELSE 0 END) AS q3_revenue
        FROM orders o
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN customers c ON c.customer_id = o.customer_id
        JOIN regions r ON r.region_id = c.region_id
        WHERE o.status = 'completed'
          AND o.order_date BETWEEN '2025-04-01' AND '2025-09-30'
        GROUP BY r.region_name
      )
      SELECT region_name, q2_orders, q3_orders,
             100.0 * (q3_orders - q2_orders) / q2_orders AS orders_change_pct,
             q2_revenue / q2_orders AS q2_avg_order_value,
             q3_revenue / q3_orders AS q3_avg_order_value,
             100.0 * (q3_revenue / q3_orders - q2_revenue / q2_orders)
                   / (q2_revenue / q2_orders) AS avg_order_value_change_pct,
             100.0 * (q3_revenue - q2_revenue) / q2_revenue AS revenue_change_pct
      FROM t ORDER BY region_name

- id: ha08
  type: why
  question: Why did customer churn spike in Q3 2025?
  notes: >-
    Verified: 44 of the 67 customers who churned in Q3 2025 were in APAC;
    APAC normally sees 1-5 churns a quarter. (APAC support tickets also
    surged Jun-Sep 2025, but Q3 churners did not file more tickets than other
    APAC customers, so tickets are not gold.)
  driver_checks:
    - text: APAC
  judge_rubric: |
    Required facts (each must be stated or clearly implied; rounded figures
    are fine):
      1. The Q3 2025 churn spike is concentrated in APAC: 44 of the 67
         customers who churned in Q3 2025 were APAC customers (about two
         thirds).
      2. This is unusual: APAC had about 1 to 5 churns in each earlier quarter
         shown, and no other region had a comparable jump in Q3 2025 (3 to 11
         churns each).
    Mentioning the APAC support-ticket surge as a possible contributing
    factor is acceptable but not required. FAIL if a required fact is missing
    or contradicted, if the main driver given is a segment, channel, product
    or another region, or if any stated figure contradicts the evidence.
    Judge facts only; ignore style and length.
  evidence:
    churn_by_region_quarter: |
      SELECT r.region_name,
             substr(c.churn_date, 1, 4) || '-Q' || ((CAST(substr(c.churn_date, 6, 2) AS INTEGER) + 2) / 3) AS quarter,
             COUNT(*) AS churned
      FROM customers c JOIN regions r ON r.region_id = c.region_id
      WHERE c.churn_date BETWEEN '2024-07-01' AND '2025-12-31'
      GROUP BY r.region_name, quarter ORDER BY r.region_name, quarter

- id: ha09
  type: why
  question: Why did Hardware revenue drop so sharply from Q2 to Q3 2025?
  notes: >-
    Verified: Hardware units sold fell from 2,741 to 778 (-72%) while the
    average unit price (~1,000) and average discount (~5%) were essentially
    unchanged; Hardware's share of units fell from ~30% to ~10%.
  driver_checks:
    - pattern: "\\b(units?|volume|quantit(y|ies))\\b|fewer\\s+(hardware\\s+)?(items|products|sales)"
  judge_rubric: |
    Required facts (each must be stated or clearly implied; rounded figures
    are fine):
      1. Far fewer Hardware units were sold: about 2,741 in Q2 versus about
         778 in Q3 2025 (about -72%).
      2. The average Hardware unit price (about 1,000) and the average
         discount (about 5%) were essentially unchanged, so price and
         discounts do not explain the drop.
    Mentioning that Hardware's share of units sold fell (from about 30% to
    about 10%) is fine but not required. FAIL if a required fact is missing
    or contradicted, if the drop is attributed mainly to price cuts,
    discounts, refunds or cancellations, or if any stated figure contradicts
    the evidence. Judge facts only; ignore style and length.
  evidence:
    hardware_volume_price_discount: |
      SELECT CASE WHEN o.order_date <= '2025-06-30' THEN 'Q2' ELSE 'Q3' END AS quarter,
             SUM(oi.quantity) AS units,
             AVG(oi.unit_price) AS avg_unit_price,
             AVG(oi.discount) AS avg_discount,
             SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN products p ON p.product_id = oi.product_id
      WHERE o.status = 'completed' AND p.category = 'Hardware'
        AND o.order_date BETWEEN '2025-04-01' AND '2025-09-30'
      GROUP BY quarter ORDER BY quarter
    hardware_status_mix: |
      SELECT CASE WHEN o.order_date <= '2025-06-30' THEN 'Q2' ELSE 'Q3' END AS quarter,
             o.status, SUM(oi.quantity) AS units
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN products p ON p.product_id = oi.product_id
      WHERE p.category = 'Hardware'
        AND o.order_date BETWEEN '2025-04-01' AND '2025-09-30'
      GROUP BY quarter, o.status ORDER BY quarter, o.status

