# Verified example pool for the shared context (question and SQL only).
# Generated by scripts/build_example_pool.py from the legacy question files;
# do not edit by hand. No example paraphrases or shares an answer with any
# showcase or holdout question; every exclusion and its reason is listed.
pool:
- id: orig/q01
  question: How many customers do we have in total?
  sql: SELECT COUNT(*) FROM customers
- id: orig/q03
  question: List the product categories we sell.
  sql: SELECT DISTINCT category FROM products
- id: orig/q06
  question: Which product category generated the most revenue in 2025?
  sql: SELECT p.category, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS rev FROM
    orders o JOIN order_items oi ON oi.order_id = o.order_id JOIN products p ON p.product_id
    = oi.product_id WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' GROUP BY
    p.category ORDER BY rev DESC
- id: orig/q08
  question: What is the average number of orders per customer?
  sql: SELECT CAST(COUNT(*) AS REAL) / (SELECT COUNT(*) FROM customers) FROM orders
- id: heldout/h01
  question: How much discount did we give away on completed orders in 2025?
  sql: SELECT ROUND(SUM(oi.quantity * oi.unit_price * oi.discount), 2) FROM orders o JOIN
    order_items oi ON oi.order_id = o.order_id WHERE o.status = 'completed' AND o.order_date
    >= '2025-01-01' AND o.order_date <= '2025-12-31'
- id: heldout/h04
  question: Which customer segment filed the most support tickets per customer in 2025?
  sql: SELECT c.segment, 1.0 * COUNT(t.ticket_id) / (SELECT COUNT(*) FROM customers c2 WHERE
    c2.segment = c.segment) AS tickets_per_customer FROM support_tickets t JOIN customers
    c ON c.customer_id = t.customer_id WHERE t.created_date >= '2025-01-01' AND t.created_date
    <= '2025-12-31' GROUP BY c.segment ORDER BY tickets_per_customer DESC
- id: heldout/h05
  question: How many products are in the Software category?
  sql: SELECT COUNT(*) FROM products WHERE category = 'Software'
- id: diag/d03
  question: How many customers have churned?
  sql: SELECT COUNT(*) FROM customers WHERE churn_date IS NOT NULL
- id: diag/d04
  question: How many support tickets are still unresolved?
  sql: SELECT COUNT(*) FROM support_tickets WHERE resolved_date IS NULL
- id: diag/d05
  question: What is the average list price of our Software products?
  sql: SELECT AVG(list_price) FROM products WHERE category = 'Software'
- id: diag/d07
  question: What is our total marketing spend on the Online channel?
  sql: SELECT SUM(amount) FROM marketing_spend WHERE channel = 'Online'
- id: diag/d10
  question: Which customer segment has the fewest customers in EMEA?
  sql: SELECT c.segment FROM customers c JOIN regions r ON r.region_id = c.region_id WHERE
    r.region_name = 'EMEA' GROUP BY c.segment ORDER BY COUNT(*) ASC
- id: diag/d13
  question: How many critical support tickets have Enterprise customers raised?
  sql: SELECT COUNT(*) FROM support_tickets t JOIN customers c ON c.customer_id = t.customer_id
    WHERE t.severity = 'critical' AND c.segment = 'Enterprise'
- id: diag/d17
  question: Which product actually made us the most money in 2025 once you account for discounts
    and what the product costs us?
  sql: SELECT p.product_name FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' AND o.order_date
    >= '2025-01-01' AND o.order_date <= '2025-12-31' GROUP BY p.product_id, p.product_name
    ORDER BY SUM(oi.quantity * (oi.unit_price * (1 - oi.discount) - p.unit_cost)) DESC
- id: diag/d19
  question: How many customers have placed orders but never had a single one completed?
  sql: SELECT COUNT(*) FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id
    = c.customer_id) AND NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id
    AND o.status = 'completed')
- id: diag/d23
  question: On average, how many days does it take us to resolve high or critical tickets
    from APAC customers?
  sql: SELECT AVG(julianday(t.resolved_date) - julianday(t.created_date)) FROM support_tickets
    t JOIN customers c ON c.customer_id = t.customer_id JOIN regions r ON r.region_id = c.region_id
    WHERE r.region_name = 'APAC' AND t.severity IN ('high', 'critical') AND t.resolved_date
    IS NOT NULL
- id: hold1/h01
  question: What is the lowest unit cost of any Accessories product?
  sql: SELECT MIN(unit_cost) FROM products WHERE category = 'Accessories'
- id: hold1/h03
  question: How many customers are in the Mid-Market segment?
  sql: SELECT COUNT(*) FROM customers WHERE segment = 'Mid-Market'
- id: hold1/h04
  question: Which region got the most marketing spend in 2024?
  sql: SELECT r.region_name FROM marketing_spend m JOIN regions r ON r.region_id = m.region_id
    WHERE m.month >= '2024-01' AND m.month <= '2024-12' GROUP BY r.region_name ORDER BY SUM(m.amount)
    DESC
- id: hold1/h05
  question: On average, how many line items does an order contain?
  sql: SELECT CAST(COUNT(*) AS REAL) / (SELECT COUNT(*) FROM orders) FROM order_items
- id: hold1/h07
  question: Which region has the highest proportion of customers who have raised at least
    one critical support ticket?
  sql: SELECT r.region_name FROM regions r JOIN customers c ON c.region_id = r.region_id LEFT
    JOIN support_tickets t ON t.customer_id = c.customer_id AND t.severity = 'critical' GROUP
    BY r.region_name ORDER BY CAST(COUNT(DISTINCT t.customer_id) AS REAL) / COUNT(DISTINCT
    c.customer_id) DESC
- id: hold1/h08
  question: Which product category grew its completed revenue the most from 2024 to 2025,
    in dollar terms?
  sql: SELECT p.category FROM orders o JOIN order_items oi ON oi.order_id = o.order_id JOIN
    products p ON p.product_id = oi.product_id WHERE o.status = 'completed' GROUP BY p.category
    ORDER BY SUM(CASE WHEN o.order_date >= '2025-01-01' THEN oi.quantity * oi.unit_price *
    (1 - oi.discount) ELSE 0 END) - SUM(CASE WHEN o.order_date < '2025-01-01' THEN oi.quantity
    * oi.unit_price * (1 - oi.discount) ELSE 0 END) DESC
- id: hold1/h09
  question: Among customers who have never filed a support ticket, how many have placed more
    than 10 orders?
  sql: SELECT COUNT(*) FROM ( SELECT o.customer_id FROM orders o WHERE NOT EXISTS (SELECT
    1 FROM support_tickets t WHERE t.customer_id = o.customer_id) GROUP BY o.customer_id HAVING
    COUNT(*) > 10)
