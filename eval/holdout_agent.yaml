# --- segment comparison with a conditional follow-up ------------------------
# Gold encodes the condition, so the expected branch is computed, not typed.
- id: ha19
  type: segment_comparison
  question: >-
    Compare the 2025 average completed order value of Enterprise and SMB
    customers. If Enterprise's is more than 20% higher than SMB's, break down
    Enterprise's 2025 completed revenue by product category; otherwise, break
    down SMB's 2025 completed revenue by product category.
  notes: Enterprise 2,854 vs SMB 2,839 (+0.5%), so the SMB branch applies.
  gold:
    sql: |
      WITH aov AS (
        SELECT c.segment,
               SUM(oi.quantity * oi.unit_price * (1 - oi.discount))
                 / COUNT(DISTINCT o.order_id) AS v
        FROM orders o
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN customers c ON c.customer_id = o.customer_id
        WHERE o.status = 'completed'
          AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
          AND c.segment IN ('Enterprise', 'SMB')
        GROUP BY c.segment
      ),
      pick AS (
        SELECT CASE WHEN (SELECT v FROM aov WHERE segment = 'Enterprise')
                         > 1.2 * (SELECT v FROM aov WHERE segment = 'SMB')
                    THEN 'Enterprise' ELSE 'SMB' END AS segment
      )
      SELECT p.category, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN products p ON p.product_id = oi.product_id
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.status = 'completed'
        AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        AND c.segment = (SELECT segment FROM pick)
      GROUP BY p.category
  answer_checks:
    - text: SMB
  evidence:
    aov_2025: |
      SELECT c.segment,
             SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / COUNT(DISTINCT o.order_id) AS aov
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.status = 'completed'
        AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
      GROUP BY c.segment ORDER BY c.segment

- id: ha20
  type: segment_comparison
  question: >-
    Compare the 2025 refund rate (refunded orders as a percentage of all
    orders) of the Online and Direct channels. If the gap is more than 1.5
    percentage points, show the 2025 refund rate by region for whichever of
    the two channels is higher; otherwise, give the overall 2025 refund rate
    across all channels.
  notes: Online 17.0% vs Direct 15.0% (gap 2.0 pp), so Online by region applies.
  gold:
    sql: |
      WITH rate AS (
        SELECT channel, 100.0 * SUM(status = 'refunded') / COUNT(*) AS pct
        FROM orders
        WHERE order_date BETWEEN '2025-01-01' AND '2025-12-31'
          AND channel IN ('Online', 'Direct')
        GROUP BY channel
      ),
      pick AS (
        SELECT CASE WHEN ABS((SELECT pct FROM rate WHERE channel = 'Online')
                           - (SELECT pct FROM rate WHERE channel = 'Direct')) > 1.5
                    THEN (SELECT channel FROM rate ORDER BY pct DESC LIMIT 1)
               END AS channel
      )
      SELECT r.region_name, 100.0 * SUM(o.status = 'refunded') / COUNT(*) AS refund_rate_pct
      FROM orders o
      JOIN customers c ON c.customer_id = o.customer_id
      JOIN regions r ON r.region_id = c.region_id
      WHERE o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        AND o.channel = (SELECT channel FROM pick)
      GROUP BY r.region_name
  answer_checks:
    - text: Online
  evidence:
    refund_rate_by_channel_2025: |
      SELECT channel, 100.0 * SUM(status = 'refunded') / COUNT(*) AS refund_rate_pct
      FROM orders WHERE order_date BETWEEN '2025-01-01' AND '2025-12-31'
      GROUP BY channel ORDER BY channel

- id: ha21
  type: segment_comparison
  question: >-
    Compare how many support tickets APAC and EMEA customers opened in 2025.
    If APAC opened more than 1.5 times as many as EMEA, break APAC's 2025
    tickets down by month (label months as YYYY-MM); otherwise, break both
    regions' 2025 tickets down by severity.
  notes: APAC 741 vs EMEA 397 (1.87x), so APAC by month applies.
  gold:
    sql: |
      WITH counts AS (
        SELECT r.region_name, COUNT(*) AS n
        FROM support_tickets t
        JOIN customers c ON c.customer_id = t.customer_id
        JOIN regions r ON r.region_id = c.region_id
        WHERE t.created_date BETWEEN '2025-01-01' AND '2025-12-31'
          AND r.region_name IN ('APAC', 'EMEA')
        GROUP BY r.region_name
      )
      SELECT substr(t.created_date, 1, 7) AS month, COUNT(*) AS tickets
      FROM support_tickets t
      JOIN customers c ON c.customer_id = t.customer_id
      JOIN regions r ON r.region_id = c.region_id
      WHERE t.created_date BETWEEN '2025-01-01' AND '2025-12-31'
        AND r.region_name = 'APAC'
        AND (SELECT n FROM counts WHERE region_name = 'APAC')
            > 1.5 * (SELECT n FROM counts WHERE region_name = 'EMEA')
      GROUP BY month
  answer_checks:
    - text: APAC
  evidence:
    tickets_2025_by_region: |
      SELECT r.region_name, COUNT(*) AS tickets
      FROM support_tickets t
      JOIN customers c ON c.customer_id = t.customer_id
      JOIN regions r ON r.region_id = c.region_id
      WHERE t.created_date BETWEEN '2025-01-01' AND '2025-12-31'
      GROUP BY r.region_name ORDER BY r.region_name
